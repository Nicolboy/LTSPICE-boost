# FICHE DE BANC — LTSPICE-boost, étage 1
#
# Prémisses du montage RÉEL, confrontées à chaque netlist par
# .claude/skills/sim-spice/scripts/gendarme.py.
#
# ACTÉE LE 2026-11-21 au terme de la remise à plat des cinq choix
# (03-architectures/frequence-mode.md). NE PAS la déduire d'un fichier de
# banc antérieur — c'est la faute A1-A5, six divergences, six reprises du
# concepteur.

[montage]
inductance    = "SER2211-473 47 µH"          # Coilcraft, modèle Model1D publié
mode          = "CCM"                        # au-dessus de la frontière ; DCM en dessous
diode         = "Vishay V8PA22 200 V 8 A"    # Schottky TMBS, SMPA DO-221BC
interrupteur  = "Infineon IPD530N15N3"       # OptiMOS 3, 150 V, 53 mΩ, DPAK
reseau_entree = "hybride 270 µF/35 V ∥ (1000 µF + 500 mΩ placée) ∥ (1 µF X7R 200 V 1812 + 0,2 Ω)"
reseau_sortie = "Nichicon EGXF201ELL131MM20S 130 µF/200 V ∥ (1 µF X7R 200 V 1812 + 0,2 Ω)"

# Les 500 mΩ sont une résistance PLACÉE, branche d'amortissement RC — pas
# une ESR. Les lire comme un parasite efface une décision de conception (A6).
#
# L'ESR du condensateur de SORTIE est également un ÉLÉMENT DE CONCEPTION :
# non amortie, la résonance du double pôle atteint Q = 118 (+41 dB) ; à
# 100 mΩ elle tombe à Q = 2,6, et le zéro d'ESR à 5,3 kHz apporte +90° de
# phase juste sous le crossover. Un polymère faible ESR annulerait tout.

[conditions]
vin_v  = 20.0                  # plage réelle 12 à 25 V
vout_v = 80.0                  # PLAFONNÉ à 80 V — c'est ce qui rend le 150 V tenable
fsw_hz = 200e3
rg_ohm = 10.0
dvdt_v_ns = 73.0
r_boucle_ohm = 0.021           # DCR 10,7 mΩ + Rds 53 mΩ x D ; fixe τ = L/R
justification_vitesse = """\
Rg = 10 Ω retenu à l'arbitrage CEM du chapitre 4. Les 1 Ω / 150 ps du banc \
initial étaient un défaut hérité d'un banc GaN, jamais questionné : ils \
donnaient 385 V/ns et ont invalidé tout le contenu HF du chapitre (A5)."""

[mesurande]
grandeur = "surtension drain et pertes"
p_nom_w  = 50.0                # plage 5 à 50 W, PRIVILÉGIÉE 5-10 W
ordre_de_grandeur_w = 0.5
regime   = "etabli"
asservi  = false
correction_energie_stockee = true
# À 47 µH la boucle fait ~21 mΩ, donc τ ≈ 2,2 ms : une fenêtre de 7 ms est
# hors de portée. La correction ½L(I₁²−I₀²)/T est DÉCLARÉE, pas implicite —
# sans elle, 2,59 W de fausse perte (D5).

[provenance]
# "datasheet" | "utilisateur" | "POSEE"
l_47uh          = "datasheet"     # Coilcraft SER2211-473, modèle publié
diode_v8pa22    = "datasheet"     # Vishay, modèle validé au chapitre 4
mosfet          = "datasheet"     # Infineon OptiMOS3_150V_LTSpice.lib
frequence       = "datasheet"     # balayage 343 cellules, chapitre 2 §11
mode_et_reseau  = "utilisateur"   # prototype de juillet-août, corrigé en session
esr_220uf       = "POSEE"         # référence exacte non obtenue
esr_1000uf      = "POSEE"         # idem
esr_cout        = "datasheet"     # 159 mΩ a 200 kHz, modele Nichicon GXF a 7 elements
amortissement_mlcc = "calcule"    # 0,2 Ω serie : sans elle, anti-resonance a 2 MHz
mlcc_derate     = "ESTIMEE"       # -8 % a 20 V et -35 % a 80 V sur un 200 V ;
                                  # coefficients TYPIQUES, courbe constructeur non lue
l_maille        = "POSEE"         # balayée 1-16 nH, aucune valeur mesurée
classe_cispr25  = "POSEE"         # classe 3 = hypothèse de travail

# SIX valeurs POSÉES. Toute conclusion qui en dépend doit le porter.
# L'ESR du 220 µF à elle seule fait basculer la marge de stabilité de
# −3,4 à +28,9 dB : c'est la plus grosse inconnue du projet.

[firmware]
# DÉPENDANCE, pas une option. La frontière DCM/CCM tombe à 6,3 W sous 12 V,
# donc DANS la fourchette d'emploi privilégiée 5-10 W. Le plant y est
# discontinu : second ordre avec zéro à droite en CCM, premier ordre en DCM.
# Un compensateur FIXE y chasse, et le cycle limite tombe sous 20 kHz,
# en plein audible.
regulation = "C2000 CLA, gain scheduling sur le mode"
crossover_hz = 6500            # f_z minimum 19,5 kHz au coin 12 V / 25 W
# Si le firmware part sur un compensateur fixe, viser 2-3 kHz et accepter
# la réponse transitoire correspondante.
