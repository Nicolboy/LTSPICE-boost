inductance    = "I crete 2,845 A contre Isat 4,4 A publie, 35 % de marge"
bilan         = "ferme, porte W2 du gendarme -- VALIDE"

[point_ccm.pertes_detail_mw]   # le total est pertes_mw ci-dessus ; meme nom = TOML illisible (gendarme A0, 2026-11-22)
