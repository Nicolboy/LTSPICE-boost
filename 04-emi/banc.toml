mosfet        = 414.81      # 41,5 %
diode         = 367.49      # 36,8 %
rs_rc_ind     =  52.14      #  5,2 %

[point_ccm.ce_que_ca_change]
texte = """
Le bilan S'INVERSE. A 8 W en DCM, 47 % des pertes sont dans le Rp de
l'inductance, qui dissipe la sonnerie de TEMPS MORT. En CCM il n'y a
plus de temps mort : les deux semiconducteurs passent de 51 a 78 % des
pertes. Le composant limitant n'est pas le meme selon la puissance.

Et le rendement est MEILLEUR a 40 W : 97,55 contre 96,31 %. Les pertes
de sonnerie, quasi fixes, s'amortissent sur cinq fois plus de puissance.

La surtension de drain, elle, ne bouge pas : 81,9 V aux DEUX points.
Le calibre 150 V garde 45 % de marge sur toute la plage.
"""
