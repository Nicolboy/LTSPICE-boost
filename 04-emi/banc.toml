[point_ccm.pourquoi_une_charge]
texte = """
La sortie raide est legitime en DCM, ou Ipk = Vin.D.T/L ne depend pas
de Vout. En CCM le courant vaut [Vin - (1-D).Vout] / R_boucle : une
soustraction de grands nombres divisee par 50 mohms. Mesure : 0,4 % de
rapport cyclique fait passer le courant de 0 a 4,77 A. Sur une charge
resistive le meme ecart ne deplace Vout que de 1,9 V.
Le fil du rasoir n'etait pas le CCM, c'etait la source raide.
"""

[point_ccm.verifie_et_non_suppose]
etablissement = "600 periodes ; a 200 Vout derivait encore de 378 mV"
