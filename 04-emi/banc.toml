[point_ccm]
description   = "40 W sur charge resistive, CCM franc (frontiere 15,3 W)"
vin           = 20.0        # V, valeur donnee par le concepteur
vout          = 80.001      # V, mesure, apres une iteration de Newton
puissance     = 40.00       # W
charge        = 160.0       # ohms, resistive -- PAS une source raide
cout          = 2.2e-6      # F, avec ic=80
